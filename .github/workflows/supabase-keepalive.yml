name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-db:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar Supabase
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql "host=${{ secrets.DB_HOST }} port=5432 dbname=postgres user=${{ secrets.DB_USER }} sslmode=require" -c "SELECT 1;"
