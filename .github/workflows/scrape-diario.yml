name: Scrape diario

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Disparar scrapeo
        run: |
          curl -fsS --max-time 1500 "https://expouno-api.onrender.com/scrape_conciertos_agendade" -o /dev/null
          echo "Scrapeo completado"
